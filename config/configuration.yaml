# Minimal development setup for this custom integration.
# Avoid default_config here because it pulls in go2rtc, which is not available in this dev environment.
config:
frontend:
history:
logbook:
my:
system_health:


# https://www.home-assistant.io/integrations/homeassistant/
homeassistant:
  debug: true

# https://www.home-assistant.io/integrations/logger/
logger:
  default: info
  logs:
    custom_components.ads_multi: debug
